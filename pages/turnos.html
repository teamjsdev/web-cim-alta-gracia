<style>

.grid {

.slot {

    font-weight: bold;

}

.slot:hover:not(.disabled) {

}

.slot.disabled {
    background: #eee;
    color: #999;
    border-color: #ddd;
    cursor: not-allowed;
}

.slot.selected {

}

    padding: 18px;
    background: #ec4899;
    color: white;

<script>

// CONFIG
const API_URL = "https://script.google.com/macros/s/AKfycbwlMzuhDaPXWf65XhvOmraWVwjA6lbRT2DT6mL7F5IiuTf09dv_yXsbzfA1hRwjdOgH/exec";

const doctors = {
  Ginecología: [
    {

      duraciones: [20, 40],   // 👈 puede elegir

  ],

    {

  ],

  ],

  Psicología: [
    {

    },
    { 
      id: "doc5", 
      nombre: "Lic. Yamila Fontana",

  ],

  Odontología: [
    { 
      id: "doc6",

  ],

    {

  ],

  Ecografista: [

    }
  ],

  Laboratorio: [
    { 
      id: "doc9", 
      nombre: "Laboratorio",
      duraciones: [30],
      slotBase: 30
    }
  ]

};

const calendarMap = {
  doc1: "e2ad99d8971d3c2ce5a9752fe9f3dd5a5fb9c9b4ae23ea0d0d91fe74652f35cc@group.calendar.google.com",
  doc2: "43cfb8d06ca120c2f8a7dd1f43bdd4e0b0a215e235b26d6bae42ea0de33c7c4a@group.calendar.google.com",
  doc3: "eb6acf8fc35fda1ec9ab6e8af6e896cfb6a20bb18de0aaed1958dd959b16348a@group.calendar.google.com",
  doc4: "52a6cbf9f284eb9253f9886352322fc4e72548f8d6e8d279a37ad7036a1c67df@group.calendar.google.com",
  doc5: "5a09eefc16c2ff5d80e98a30481a47c880002a304452c2ce2f66a2ae3acdef1a@group.calendar.google.com",
  doc6: "39cdfe65ac605cce05ebfdb243aab966cbb0af97eea297244d5fc69a8ebc1da4@group.calendar.google.com",
  doc7: "9cb8df5ae4ebfe0d8a64cedd5a3306fcca1663cd1ab923b17b6cf203157f968c@group.calendar.google.com",
  doc8: "f5d8a8049581d8bac570c3e30791752a38550e67f197ae8195077bcae585e624@group.calendar.google.com",
  doc9: "e6c15ddda40251bc96cbee32653da4404e60c8c2fa13c4943d153a1b451eee0d@group.calendar.google.com"
};

// VARIABLES

function getDoctorConfig() {
  return doctors[esp.value].find(d => d.id === doc.value);
}

function generarSlots(slotBase){

  const fechaSeleccionada = new Date(fecha.value + "T00:00:00");
  const dia = fechaSeleccionada.getDay(); // 0 domingo

  const horarios = {
    1: { inicio: 8, fin: 11 }, // lunes
    2: { inicio: 8, fin: 17 }, // martes
    3: { inicio: 8, fin: 17 }, // miércoles
    4: { inicio: 8, fin: 12 }, // jueves
    5: { inicio: 8, fin: 13 }  // viernes
  };

  if(!horarios[dia]) return []; // sábado/domingo cerrado

  const slots = [];
  let hora = horarios[dia].inicio * 60;
  const fin = horarios[dia].fin * 60;

  while(hora < fin){
    const h = String(Math.floor(hora/60)).padStart(2,'0');
    const m = String(hora%60).padStart(2,'0');
    slots.push(`${h}:${m}`);
    hora += slotBase;
  }

  return slots;
}

function loadTiposTurno(){
  const select = document.getElementById("tipoTurno");
  select.innerHTML = "";

  const config = getDoctorConfig();

  config.duraciones.forEach(d => {

    let texto = "Consulta general";

    if(doc.value === "doc1"){
      if(d === 20) texto = "Consulta/Pap y Colpo/Ecografías";
      if(d === 40) texto = "Circuito de la mujer";
    }

    select.add(new Option(`${texto} (${d} min)`, d));
  });
}

let horarioSeleccionado = null;

const esp = document.getElementById("especialidad");
const doc = document.getElementById("doctor");
const fecha = document.getElementById("fecha");
const slots = document.getElementById("slots");
const btn = document.getElementById("btnReservar");

// bloquear fechas pasadas
const today = new Date().toLocaleDateString('en-CA');
fecha.min = today;
fecha.value = today;

// cargar especialidades
Object.keys(doctors).forEach(e => esp.add(new Option(e, e)));

function loadDoctors(){
  doc.innerHTML = "";
  doctors[esp.value].forEach(d => doc.add(new Option(d.nombre, d.id)));

  loadTiposTurno();
  updateCalendar();
  loadSlots();
}

function updateCalendar(){
  const calId = calendarMap[doc.value];
  document.getElementById("calendarFrame").src =
    `https://calendar.google.com/calendar/embed?src=${calId}&ctz=America%2FArgentina%2FCordoba`;
}

function loadSlots(){

  if(!fecha.value){
    alert("Seleccioná una fecha");
    return;
  }

  const config = getDoctorConfig();
  const duracionSeleccionada = parseInt(document.getElementById("tipoTurno").value);
  const slotsBase = generarSlots(config.slotBase);

  slots.innerHTML = "";
  horarioSeleccionado = null;
  btn.disabled = true;

  // 🕐 fecha actual
const ahora = new Date();
const hoyStr = ahora.toLocaleDateString('en-CA');

  fetch(`${API_URL}?doctor=${doc.value}&fecha=${fecha.value}`)
  .then(res => res.json())
  .then(data => {

  const ocupados = Array.isArray(data) ? data : [];


    slotsBase.forEach(h => {

      const b = document.createElement("button");
      b.className = "slot";
      b.innerText = h;

      // =========================
      // 🔴 BLOQUEO POR PASADO
      // =========================
      if(fecha.value === hoyStr){

        const partes = h.split(":");
        const horaSlot = new Date(fecha.value + "T" + h + ":00");

        if(horaSlot <= ahora){
          b.classList.add("disabled");
          slots.appendChild(b);
          return;
        }
      }

      // =========================
      // 🔴 BLOQUEO POR DURACIÓN
      // =========================
      let ocupado = false;

      for(let i = 0; i < duracionSeleccionada; i += config.slotBase){

        const partes = h.split(":");
        let minutos = parseInt(partes[0])*60 + parseInt(partes[1]) + i;

        const hh = String(Math.floor(minutos/60)).padStart(2,'0');
        const mm = String(minutos%60).padStart(2,'0');

        const horaCheck = `${hh}:${mm}`;

        if(ocupados.includes(horaCheck)){
          ocupado = true;
          break;
        }
      }

      if(ocupado){
        b.classList.add("disabled");
      } else {
        b.onclick = () => {

          horarioSeleccionado = h;

          document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
          b.classList.add("selected");

          btn.disabled = false;
        };
      }

      slots.appendChild(b);
    });

  })
  .catch(()=>{
    slots.innerHTML = "Error cargando horarios";
  });
}
    
function reservar(){

  const nombre = document.getElementById("nombre").value.trim();
  const telefono = document.getElementById("telefono").value.trim();
  const duracionSeleccionada = parseInt(document.getElementById("tipoTurno").value);

  if(
    nombre.length < 3 ||
    nombre.length > 40 ||
    !/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(nombre) ||
    !horarioSeleccionado
  ){
    alert("Ingresá nombre válido y horario");
    return;
  }

  if(
    telefono.length < 8 ||
    telefono.length > 15 ||
    !/^\d+$/.test(telefono)
  ){
    alert("Ingresá teléfono válido");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Procesando...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      nombre,
      telefono,
      fecha: fecha.value,
      hora: horarioSeleccionado,
      doctor: doc.value,
      duracion: duracionSeleccionada   // 🔥 clave
    })
  })
  .then(res => res.json())
  .then(data => {

    if(data.error){
      alert(data.error);
      btn.disabled = false;
      btn.innerText = "Confirmar Reserva Temporal";
      return;
    }

    alert("Turno reservado temporalmente ✔️");

    const horaFinal = horarioSeleccionado;

    slots.innerHTML = "";
    btn.innerText = "Confirmar Reserva Temporal";
    horarioSeleccionado = null;

    const msg = encodeURIComponent(
      `Hola, solicité turno:\n\nNombre: ${nombre}\nTeléfono: ${telefono}\nFecha: ${fecha.value}\nHora: ${horaFinal}\nDuración: ${duracionSeleccionada} min`
    );

    window.location.href = `https://wa.me/5493547448227?text=${msg}`;
  })
  .catch(()=>{
    alert("Error, intentá nuevamente");
    btn.disabled = false;
  });
}

// eventos
esp.onchange = loadDoctors;
doc.onchange = () => { updateCalendar(); loadSlots(); };
fecha.onchange = loadSlots;
    
// btn.onclick = reservar;
btn.onclick = () => {
  window.location.href = "web-en-construccion.html";
};
    
document.getElementById("tipoTurno").onchange = loadSlots;

// init
loadDoctors();

</script>
