<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<title>Turnos Online | Centro Integral de la Mujer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="/assets/logos/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { margin: 0; background: #f9fafb; color: #1f2937; }

header {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    color: white;
    padding: 50px 20px;
    text-align: center;
}

nav {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
    position: sticky;
    top: 0;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #4b5563;
    font-weight: 600;
}

section {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.05);
}

select, input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
}

.slot {
    padding: 12px;
    background: white;
    color: #ec4899;
    border: 2px solid #ec4899;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}

.slot:hover:not(.disabled) {
    background: #fdf2f8;
}

.slot.disabled {
    background: #eee;
    color: #999;
    border-color: #ddd;
    cursor: not-allowed;
}

.slot.selected {
    background: #ec4899;
    color: white;
}

#btnReservar {
    width: 100%;
    padding: 18px;
    background: #ec4899;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 30px;
    cursor: pointer;
}

#btnReservar:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

footer {
    background: #1f2937;
    color: #9ca3af;
    text-align: center;
    padding: 50px 20px;
}

.whatsapp {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #25d366;
    color: white;
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 32px;
}
</style>
</head>

<body>

<header>
<h1>Centro Integral de la Mujer</h1>
<p>Gestión de Turnos Online</p>
</header>

<nav>
<a href="/">Inicio</a>
</nav>

<section>
<h2>Reserva tu turno</h2>

<div class="card">

<label>Especialidad</label>
<select id="especialidad"></select>

<label>Profesional</label>
<select id="doctor"></select>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Tipo de consulta</label>
<select id="tipoTurno"></select>

<label>Nombre paciente</label>
<input type="text" id="nombre" placeholder="Ej: María García">

<h3>Horarios disponibles</h3>
<div class="grid" id="slots"></div>

<button id="btnReservar" disabled>Confirmar Reserva Temporal</button>

<h3 style="margin-top:40px;">Turnos ya asignados</h3>

<div style="margin-top:15px;">
  <iframe 
    id="calendarFrame" 
    style="border:0; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,.05);" 
    width="100%" 
    height="400">
  </iframe>
</div>

</div>
</section>

<footer>
<p>© 2026 Centro Integral de la Mujer</p>
</footer>

<a class="whatsapp" href="https://wa.me/5493547448227" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<script>

// CONFIG
const API_URL = "https://script.google.com/macros/s/AKfycbwlMzuhDaPXWf65XhvOmraWVwjA6lbRT2DT6mL7F5IiuTf09dv_yXsbzfA1hRwjdOgH/exec";

const doctors = {
  ginecologia: [
    { 
      id: "doc1", 
      nombre: "Dra. Astrada",
      duraciones: [20, 40],   // 👈 puede elegir
      slotBase: 20            // 👈 grilla base
    },
    { 
      id: "doc2", 
      nombre: "",
      duraciones: [30],       // 👈 fijo
      slotBase: 30
    }
  ]
};

const calendarMap = {
  doc1: "e2ad99d8971d3c2ce5a9752fe9f3dd5a5fb9c9b4ae23ea0d0d91fe74652f35cc@group.calendar.google.com"
};

const baseSlots = ["09:00","09:30","10:00","10:30","11:00","11:30"];

// VARIABLES

function getDoctorConfig() {
  return doctors[esp.value].find(d => d.id === doc.value);
}

function generarSlots(slotBase){
  const slots = [];
  let hora = 9 * 60;
  const fin = 12 * 60;

  while(hora < fin){
    const h = String(Math.floor(hora/60)).padStart(2,'0');
    const m = String(hora%60).padStart(2,'0');
    slots.push(`${h}:${m}`);
    hora += slotBase;
  }

  return slots;
}

function loadTiposTurno(){
  const select = document.getElementById("tipoTurno");
  select.innerHTML = "";

  const config = getDoctorConfig();

  config.duraciones.forEach(d => {
    const texto = d === 20 ? "Consulta/Pap y Colpo/Ecografías" :
                  d === 40 ? "Circuito de la mujer" :
                  `${d} min`;

    select.add(new Option(`${texto} (${d} min)`, d));
  });
}

let horarioSeleccionado = null;

const esp = document.getElementById("especialidad");
const doc = document.getElementById("doctor");
const fecha = document.getElementById("fecha");
const slots = document.getElementById("slots");
const btn = document.getElementById("btnReservar");

// bloquear fechas pasadas
const today = new Date().toLocaleDateString('en-CA');
fecha.min = today;
fecha.value = today;

// cargar especialidades
Object.keys(doctors).forEach(e => esp.add(new Option(e, e)));

function loadDoctors(){
  doc.innerHTML = "";
  doctors[esp.value].forEach(d => doc.add(new Option(d.nombre, d.id)));

  loadTiposTurno();
  updateCalendar();
  loadSlots();
}

function updateCalendar(){
  const calId = calendarMap[doc.value];
  document.getElementById("calendarFrame").src =
    `https://calendar.google.com/calendar/embed?src=${calId}&ctz=America%2FArgentina%2FCordoba`;
}

function loadSlots(){

  if(!fecha.value){
    alert("Seleccioná una fecha");
    return;
  }

  const config = getDoctorConfig();
  const duracionSeleccionada = parseInt(document.getElementById("tipoTurno").value);
  const slotsBase = generarSlots(config.slotBase);

  slots.innerHTML = "";
  horarioSeleccionado = null;
  btn.disabled = true;

  // 🕐 fecha actual
const ahora = new Date();
const hoyStr = ahora.toLocaleDateString('en-CA');

  fetch(`${API_URL}?doctor=${doc.value}&fecha=${fecha.value}`)
  .then(res => res.json())
  .then(data => {

  const ocupados = Array.isArray(data) ? data : [];


    slotsBase.forEach(h => {

      const b = document.createElement("button");
      b.className = "slot";
      b.innerText = h;

      // =========================
      // 🔴 BLOQUEO POR PASADO
      // =========================
      if(fecha.value === hoyStr){

        const partes = h.split(":");
        const horaSlot = new Date(fecha.value + "T" + h + ":00");

        if(horaSlot <= ahora){
          b.classList.add("disabled");
          slots.appendChild(b);
          return;
        }
      }

      // =========================
      // 🔴 BLOQUEO POR DURACIÓN
      // =========================
      let ocupado = false;

      for(let i = 0; i < duracionSeleccionada; i += config.slotBase){

        const partes = h.split(":");
        let minutos = parseInt(partes[0])*60 + parseInt(partes[1]) + i;

        const hh = String(Math.floor(minutos/60)).padStart(2,'0');
        const mm = String(minutos%60).padStart(2,'0');

        const horaCheck = `${hh}:${mm}`;

        if(ocupados.includes(horaCheck)){
          ocupado = true;
          break;
        }
      }

      if(ocupado){
        b.classList.add("disabled");
      } else {
        b.onclick = () => {

          horarioSeleccionado = h;

          document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
          b.classList.add("selected");

          btn.disabled = false;
        };
      }

      slots.appendChild(b);
    });

  })
  .catch(()=>{
    slots.innerHTML = "Error cargando horarios";
  });
}
    
function reservar(){

  const nombre = document.getElementById("nombre").value.trim();
  const duracionSeleccionada = parseInt(document.getElementById("tipoTurno").value);

  if(nombre.length < 3 || nombre.length > 40 || !horarioSeleccionado){
  alert("Completá los datos correctamente");
  return;
  }

  btn.disabled = true;
  btn.innerText = "Procesando...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      nombre,
      fecha: fecha.value,
      hora: horarioSeleccionado,
      doctor: doc.value,
      duracion: duracionSeleccionada   // 🔥 clave
    })
  })
  .then(() => {

    alert("Turno reservado temporalmente ✔️");

    const horaFinal = horarioSeleccionado;

    slots.innerHTML = "";
    btn.innerText = "Confirmar Reserva Temporal";
    horarioSeleccionado = null;

    const msg = encodeURIComponent(
      `Hola, solicité turno:\n\nNombre: ${nombre}\nFecha: ${fecha.value}\nHora: ${horaFinal}\nDuración: ${duracionSeleccionada} min`
    );

    window.location.href = `https://wa.me/5493547448227?text=${msg}`;

  })
  .catch(()=>{
    alert("Error, intentá nuevamente");
    btn.disabled = false;
  });
}

// eventos
esp.onchange = loadDoctors;
doc.onchange = () => { updateCalendar(); loadSlots(); };
fecha.onchange = loadSlots;
    
// btn.onclick = reservar;
btn.onclick = () => {
  window.location.href = "web-en-construccion.html";
};
    
document.getElementById("tipoTurno").onchange = loadSlots;

// init
loadDoctors();

</script>

</body>
</html>
