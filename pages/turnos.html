<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<title>Turnos Online | Centro Integral de la Mujer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="/assets/logos/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { margin: 0; background: #f9fafb; color: #1f2937; }

header {
    background: linear-gradient(135deg, #ec4899, #f472b6);
    color: white;
    padding: 50px 20px;
    text-align: center;
}

nav {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
    position: sticky;
    top: 0;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #4b5563;
    font-weight: 600;
}

section {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.05);
}

select, input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 12px;
}

.slot {
    padding: 12px;
    background: white;
    color: #ec4899;
    border: 2px solid #ec4899;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
}

.slot:hover:not(.disabled) {
    background: #fdf2f8;
}

.slot.disabled {
    background: #eee;
    color: #999;
    border-color: #ddd;
    cursor: not-allowed;
}

.slot.selected {
    background: #ec4899;
    color: white;
}

#btnReservar {
    width: 100%;
    padding: 18px;
    background: #ec4899;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 30px;
    cursor: pointer;
}

#btnReservar:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

footer {
    background: #1f2937;
    color: #9ca3af;
    text-align: center;
    padding: 50px 20px;
}

.whatsapp {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #25d366;
    color: white;
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 32px;
}
</style>
</head>

<body>

<header>
<h1>Centro Integral de la Mujer</h1>
<p>Gestión de Turnos Online</p>
</header>

<nav>
<a href="/">Inicio</a>
</nav>

<section>
<h2>Reserva tu turno</h2>

<div class="card">

<label>Especialidad</label>
<select id="especialidad"></select>

<label>Profesional</label>
<select id="doctor"></select>

<label>Fecha</label>
<input type="date" id="fecha">

<h3>Calendario</h3>
<iframe id="calendarFrame" style="border:0; border-radius:15px; margin-bottom:25px;" width="100%" height="400"></iframe>

<label>Nombre</label>
<input type="text" id="nombre" placeholder="Ej: María García">

<h3>Horarios disponibles</h3>
<div class="grid" id="slots"></div>

<button id="btnReservar" disabled>Confirmar Reserva Temporal</button>

</div>
</section>

<footer>
<p>© 2026 Centro Integral de la Mujer</p>
</footer>

<a class="whatsapp" href="https://wa.me/5493547448227" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<script>

// CONFIG
const API_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycby2XAk6NdFCa1FXErjrp8fbvUsj2OdeVHlwnvP3ZzOHmbKxyB1B-rocAyTTjmIaY6vy/exec";

const doctors = {
  ginecologia: [
    { id: "doc1", nombre: "Dra. Astrada" },
//  { id: "doc2", nombre: "Dra. López" }
    { id: "doc3", nombre: "" }
  ]
};

const calendarMap = {
  doc1: "e2ad99d8971d3c2ce5a9752fe9f3dd5a5fb9c9b4ae23ea0d0d91fe74652f35cc@group.calendar.google.com",
  doc2: "TU_CALENDAR_ID_2"
};

const baseSlots = ["09:00","09:30","10:00","10:30","11:00","11:30"];

// VARIABLES
let horarioSeleccionado = null;

const esp = document.getElementById("especialidad");
const doc = document.getElementById("doctor");
const fecha = document.getElementById("fecha");
const slots = document.getElementById("slots");
const btn = document.getElementById("btnReservar");

// bloquear fechas pasadas
const today = new Date().toISOString().split('T')[0];
fecha.min = today;
fecha.value = today;

// cargar especialidades
Object.keys(doctors).forEach(e => esp.add(new Option(e, e)));

function loadDoctors(){
  doc.innerHTML = "";
  doctors[esp.value].forEach(d => doc.add(new Option(d.nombre, d.id)));
  updateCalendar();
  loadSlots();
}

function updateCalendar(){
  const calId = calendarMap[doc.value];
  document.getElementById("calendarFrame").src =
    `https://calendar.google.com/calendar/embed?src=${calId}&ctz=America%2FArgentina%2FCordoba`;
}

function loadSlots(){

  if(!fecha.value){
    alert("Seleccioná una fecha");
    return;
  }

  slots.innerHTML = "";
  horarioSeleccionado = null;
  btn.disabled = true;

  fetch(`${API_URL}?doctor=${doc.value}&fecha=${fecha.value}`)
  .then(res => res.json())
  .then(ocupados => {

    baseSlots.forEach(h => {

      const b = document.createElement("button");
      b.className = "slot";
      b.innerText = h;

      if(ocupados.includes(h)){
        b.classList.add("disabled");
      } else {
        b.onclick = () => {

          horarioSeleccionado = h;

          document.querySelectorAll(".slot").forEach(s => s.classList.remove("selected"));
          b.classList.add("selected");

          // animación
          b.style.transform = "scale(0.95)";
          setTimeout(()=> b.style.transform="scale(1)",100);

          btn.disabled = false;
        };
      }

      slots.appendChild(b);
    });

  });
}

function reservar(){

  const nombre = document.getElementById("nombre").value.trim();

  if(nombre.length < 3 || !horarioSeleccionado){
    alert("Completá los datos correctamente");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Procesando...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      nombre,
      fecha: fecha.value,
      hora: horarioSeleccionado,
      doctor: doc.value
    })
  })
  .then(() => {

    alert("Turno reservado temporalmente ✔️");

    // reset UI
    slots.innerHTML = "";
    btn.innerText = "Confirmar Reserva Temporal";
    horarioSeleccionado = null;

    const msg = encodeURIComponent(
      `Hola, solicité turno:\n\nNombre: ${nombre}\nFecha: ${fecha.value}\nHora: ${horarioSeleccionado}`
    );

    window.location.href = `https://wa.me/5493547448227?text=${msg}`;

  })
  .catch(()=>{
    alert("Error, intentá nuevamente");
    btn.disabled = false;
  });
}

// eventos
esp.onchange = loadDoctors;
doc.onchange = () => { updateCalendar(); loadSlots(); };
fecha.onchange = loadSlots;
btn.onclick = reservar;

// init
loadDoctors();

</script>

</body>
</html>
